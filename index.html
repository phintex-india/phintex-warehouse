<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#163351">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Godown Stock">
<title>Godown Stock Manager</title>
<link rel="icon" id="fav">
<style>
:root{--nav:#163351;--nav2:#21466f;--acc:#0e95a2;--acc2:#ec7a1a;--teal:#12b2c0;--bg:#f2f5f9;--card:#fff;--line:#e3e8ef;--txt:#1b2533;--mut:#6b7789;--ok:#15803d;--bad:#c62828;--warn:#b45309;--r:10px}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
button,input,select,textarea{font:inherit}
a{color:var(--acc)}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,#163351 0%,#1d4a72 55%,#12b2c0 135%);position:relative;overflow:hidden}
#login:before{content:"";position:absolute;right:-90px;top:-90px;width:280px;height:280px;border-radius:50%;background:#ec7a1a;opacity:.9}
#login:after{content:"";position:absolute;left:-60px;bottom:-60px;width:0;height:0;border-left:260px solid transparent;border-bottom:260px solid rgba(18,178,192,.35)}
.lbox{background:#fff;border-radius:16px;padding:30px 30px 26px;position:relative;z-index:1;border-top:5px solid #ec7a1a;width:min(400px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.lbox h1{margin:0 0 4px;font-size:20px;color:var(--nav);text-align:center}
#llogo{display:block;width:240px;max-width:80%;margin:0 auto 16px}
.lgm{width:42px;height:42px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}.lgm img{width:34px;height:34px}
.lbox p{margin:0 0 20px;color:var(--mut);text-align:center}
.logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;margin-bottom:14px}
#app{display:none;min-height:100vh}
#side{position:fixed;left:0;top:0;bottom:0;width:236px;background:var(--nav);color:#c9d6e8;overflow-y:auto;z-index:30;transition:transform .2s}
#side .brand{padding:16px 16px 12px;display:flex;gap:10px;align-items:center;border-bottom:1px solid rgba(255,255,255,.08)}
#side .brand .logo{width:36px;height:36px;font-size:14px;margin:0;border-radius:9px;flex:none}
#side .brand b{color:#fff;display:block;font-size:13.5px;line-height:1.25}
#side .brand small{font-size:11px;color:#8fa6c4}
.navg{padding:10px 0 4px}
.navg>div:first-child{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#6f88a8;padding:6px 18px}
.nv{display:flex;align-items:center;gap:10px;padding:8px 18px;cursor:pointer;color:#c9d6e8;border-left:3px solid transparent;font-size:13.5px}
.nv:hover{background:var(--nav2);color:#fff}
.nv.on{background:var(--nav2);color:#fff;border-left-color:#ec7a1a}
.nv i{font-style:normal;width:18px;text-align:center}
#main{margin-left:236px;min-height:100vh}
#top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 20px}
#top h2{margin:0;font-size:17px;flex:1}
#ham{display:none;border:0;background:none;font-size:22px;cursor:pointer}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.who b{color:var(--txt)}
.av{width:32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
#view{padding:20px}
@media(max-width:900px){#side{transform:translateX(-100%)}#side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}#main{margin-left:0}#ham{display:block}#view{padding:12px}.who .wn{display:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:14px}.grid>*{min-width:0}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--acc))}
.kpi small{color:var(--mut);font-size:12px}
.kpi b{display:block;font-size:22px;margin-top:4px}
.kpi span{font-size:11.5px;color:var(--mut)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:4px;min-width:150px;flex:1}
.f label{font-size:12px;color:var(--mut);font-weight:600}
.rq{color:var(--bad)}
input,select,textarea{border:1px solid #cdd5e0;border-radius:8px;padding:8px 10px;background:#fff;color:var(--txt);width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(18,178,192,.2)}
input[readonly]{background:#f5f7fa}
input[type=checkbox]{width:auto}
.btn{text-decoration:none;border:1px solid #cdd5e0;background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--txt);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#f3f6fa}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.p:hover{background:#0b7d88}
.btn.g{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.d{color:var(--bad);border-color:#f0c4c4}.btn.d:hover{background:#fdecec}
.btn.sm{padding:4px 9px;font-size:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:65vh}
table{border-collapse:collapse;width:100%;font-size:12.8px}
th{background:#e9f0f6;text-align:left;padding:8px 9px;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:#45536a;position:sticky;top:0;z-index:1;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:7px 9px;border-bottom:1px solid #edf0f5;white-space:nowrap}
tr:hover td{background:#f8fbff}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{background:#f6f8fb;font-weight:700;position:sticky;bottom:0}
.bdg{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;color:#fff;background:var(--c,#64748b)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:600}
.tag.ok{background:#e3f5e8;color:var(--ok)}.tag.bad{background:#fde8e8;color:var(--bad)}.tag.warn{background:#fff3dc;color:var(--warn)}.tag.inf{background:#e6effc;color:var(--acc)}.tag.mu{background:#eef1f5;color:#566275}
.pos{color:var(--ok);font-weight:600}.neg{color:var(--bad);font-weight:600}.mut{color:var(--mut)}
.hint{background:#eef6ff;border:1px solid #cfe2fb;color:#1e4f8f;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.warnbox{background:#fff6e6;border:1px solid #f5d9a6;color:#7a4b00;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.tbtn{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.tb{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;border-top:3px solid var(--c)}
.tb:hover{box-shadow:0 4px 14px rgba(15,39,68,.08)}
.tb b{display:block;font-size:13.5px}.tb small{color:var(--mut);font-size:11.5px}
.lines td{padding:5px 6px;vertical-align:top}.lines input{padding:6px 7px}
.lines .sub{font-size:11px;color:var(--mut);margin-top:3px;white-space:normal}
.srow td{background:#fafcff!important;white-space:normal}
.chips{display:flex;flex-wrap:wrap;gap:5px;max-height:180px;overflow:auto}
.chip{font-family:Consolas,monospace;font-size:11.5px;background:#e6f7f9;border:1px solid #b8e6ec;border-radius:6px;padding:2px 4px 2px 7px;display:inline-flex;align-items:center;gap:4px}
.chip b{cursor:pointer;color:var(--bad);font-weight:700;padding:0 3px}
.chip.miss{background:#fde8e8;border-color:#f3c0c0;text-decoration:line-through}
.sbtn{border:1px solid #b8e6ec;background:#e6f7f9;color:var(--acc);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;cursor:pointer}
.sbtn.bad{background:#fde8e8;border-color:#f3c0c0;color:var(--bad)}
.scanbar{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.scanbar .big{flex:3;min-width:240px;font-size:15px;padding:12px 14px;border:2px dashed #9fc0ef;background:#f6faff}
.scanlog{font-size:12.5px;margin-top:8px;min-height:18px}
.tot{width:min(380px,100%);margin-left:auto;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tot div{display:flex;justify-content:space-between;padding:6px 12px;border-bottom:1px solid #eef1f5;font-variant-numeric:tabular-nums}
.tot div.gt{background:var(--nav);color:#fff;font-weight:700;font-size:16px;border:0}
.words{font-size:12px;color:var(--mut);margin-top:6px;text-align:right}
.party{font-size:12px;color:var(--mut);margin-top:4px;min-height:16px}
.pk{position:absolute;z-index:999;background:#fff;border:1px solid #cdd5e0;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.15);max-height:300px;overflow:auto;display:none}
.pki{padding:7px 10px;cursor:pointer;border-bottom:1px solid #f0f2f6}
.pki b{display:block;font-size:13px;font-weight:600}.pki small{color:var(--mut);font-size:11.5px}
.pki.on,.pki:hover{background:#e3f6f8}
.modal{position:fixed;inset:0;background:rgba(10,20,35,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 10px;overflow:auto}
.mbox{background:#fff;border-radius:12px;width:min(820px,100%);padding:20px;position:relative}
.mbox .x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--mut)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2533;color:#fff;padding:10px 18px;border-radius:8px;z-index:300;display:none;font-size:13px;max-width:90vw}
.sync{font-size:11.5px;padding:3px 9px;border-radius:20px;background:#eef2f8;color:var(--mut);cursor:pointer}
.sync.ok{background:#e3f5e8;color:var(--ok)}.sync.err{background:#fde8e8;color:var(--bad)}
#reader{width:100%;max-width:440px;margin:auto}
video{width:100%;border-radius:8px;background:#000}
.lbl-sheet{display:flex;flex-wrap:wrap;gap:8px}
.lbl{border:1px dashed #9aa6b8;padding:6px 8px;width:62mm;height:34mm;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;background:#fff}
.lbl .nm{font-weight:700;font-size:11px;line-height:1.2;max-height:2.4em;overflow:hidden}
.lbl .al{font-size:9.5px;color:#444}
.lbl svg{width:100%;height:12mm}
.lbl .cd{font-family:monospace;font-size:10px;text-align:center;letter-spacing:1px}
.empty{text-align:center;padding:30px;color:var(--mut)}
.split{display:grid;grid-template-columns:2fr 1fr;gap:16px}.split>div{min-width:0}
@media(max-width:1000px){.split{grid-template-columns:1fr}}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:12.5px}
.seg button.on{background:var(--c);border-color:var(--c);color:#fff}
#printArea{display:none}
.pinv{font-family:Arial,sans-serif;font-size:11.5px;color:#000}
.pinv table{font-size:11px}.pinv th,.pinv td{border:1px solid #555;padding:4px 6px;white-space:normal}
.pinv th{background:#eee!important;position:static;color:#000}
.pinv .hd{border:1px solid #555;padding:8px;text-align:center}
.pinv .box{display:grid;grid-template-columns:1fr 1fr;border:1px solid #555;border-top:0}
.pinv .box>div{padding:6px 8px}.pinv .box>div+div{border-left:1px solid #555}
.pinv .ann{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid #555;font-family:Consolas,monospace;font-size:10.5px}
.pinv .ann div{padding:3px 6px;border-bottom:1px solid #ccc;border-right:1px solid #ccc}
@media print{
 body{background:#fff}
 #app,#login,.modal,#toast{display:none!important}
 #printArea{display:block!important}
 #printArea table{font-size:11px}
 #printArea th{position:static;background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .lbl{border:1px dashed #ccc;page-break-inside:avoid}
 .pgb{page-break-before:always}
}
</style>
</head>

<div id="login">
 <div class="lbox">

  <button class="btn p" style="width:100%;justify-content:center;padding:11px" id="lbtn">Login</button>
  <div id="lerr" style="color:var(--bad);font-size:13px;margin-top:10px"></div>
  <button class="btn" id="instBtn" style="display:none;width:100%;justify-content:center;margin-top:10px" onclick="if(_inst){_inst.prompt();_inst.userChoice.then(()=>{_inst=null;this.style.display='none'})}">📲 Install App on this phone</button>

  <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--mut);text-align:center">🛠️ Help: Developer <b style="color:var(--nav)">Ritik Gupta</b> • 📞 <a href="tel:+918114019506"><b>81140 19506</b></a></div>
 </div>
</div>

<div id="app">
 <aside id="side"></aside>
 <div id="main">
  <div id="top">
   <button id="ham">☰</button>
   <h2 id="ttl">Dashboard</h2>
   <span class="sync" id="syncSt" title="Cloud sync">Offline mode</span>
   <div class="who"><div class="av" id="av">A</div><div class="wn"><b id="wn"></b><br><span id="wg"></span></div></div>
   <button class="btn sm" id="logout">Logout</button>
  </div>
  <div id="view"></div>
 </div>
</div>
<div id="toast"></div>
<div id="printArea"></div>

async function scanner(onCode,cont){
 const m=modal(`<h3 style="margin-top:0">📷 Scan QR / Barcode ${cont?'<span class="tag ok">Continuous mode</span>':''}</h3><p class="mut" style="margin-top:-6px">Hold the camera over the QR / barcode. ${cont?'Keep scanning one after another — close this window when done.':''} A USB / Bluetooth scanner can scan directly into the scan box.</p>

 <div id="scmsg" style="margin-top:8px;font-weight:600"></div><div id="sccnt" class="mut" style="font-size:12px"></div>`);
 let stream=null,stop=false,h5=null,last='',lastT=0,cnt=0;
 const msg=(t,ok)=>{const e=m.querySelector('#scmsg');if(e){e.textContent=t;e.style.color=ok===false?'var(--bad)':ok?'var(--ok)':''}};
 const done=async c=>{c=String(c).trim();const now=Date.now();if(stop||!c||(c===last&&now-lastT<2500))return;last=c;lastT=now;
  if(!cont){stop=true;m.close()}
  const r=await onCode(c);if(r&&cont){beep(r.ok);msg(r.msg,!!r.ok);if(r.ok)cnt++;const cc=m.querySelector('#sccnt');if(cc)cc.textContent='Successful scans in this session: '+cnt}};
 m._onclose=()=>{stop=true;if(stream)stream.getTracks().forEach(t=>t.stop());if(h5)h5.stop().catch(()=>{})};
 m.querySelector('#scm').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim()){done(e.target.value);e.target.value=''}};
 try{
  if('BarcodeDetector' in window){
   const det=new BarcodeDetector();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}}});
   const v=m.querySelector('#scv');v.srcObject=stream;await v.play();msg('Scanning…');
   const loop=async()=>{if(stop)return;try{const r=await det.detect(v);if(r.length)await done(r[0].rawValue)}catch(e){}setTimeout(loop,120)};loop();
  }else{
   msg('Loading scanner…');await loadScript('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js');
   m.querySelector('#reader').innerHTML='';h5=new Html5Qrcode('reader');
   await h5.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:200}},t=>done(t));msg('Scanning…');
  }
 }catch(e){msg('Camera could not start ('+e.message+'). Type the code manually.',false)}
}

function barcodeSVG(text,h){h=h||40;const c=[104];for(const ch of String(text)){let v=ch.charCodeAt(0)-32;if(v<0||v>94)v=0;c.push(v)}let s=104;for(let i=1;i<c.length;i++)s+=c[i]*i;c.push(s%103,106);
 let x=10,r='';c.forEach(v=>{const p=C128[v];for(let k=0;k<p.length;k++){const w=+p[k];if(k%2===0)r+=`<rect x="${x}" y="0" width="${w}" height="${h}"/>`;x+=w}});x+=10;

async function readFileTable(f){
 const ext=f.name.split('.').pop().toLowerCase();
 if(ext==='csv'||ext==='txt')return parseCSV(await f.text());
 await loadScript(XLSXURL);const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
}
function parseCSV(t){const sep=t.split('\n')[0].includes('\t')?'\t':',';const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===sep){row.push(cur);cur=''}else if(c==='\n'){row.push(cur.replace(/\r$/,''));rows.push(row);row=[];cur=''}else cur+=c}
 if(cur||row.length){row.push(cur);rows.push(row)}return rows.filter(r=>r.some(x=>String(x).trim()))}

/* scan routing: product barcode → +1 qty ; serial(s) → right product line ; pallet no → bulk */
async function entryScan(raw){
 const v=CUR.v;raw=String(raw||'').trim();if(!raw)return{ok:0,msg:'Empty scan'};
 const isOut=OUTT.includes(v.type),isIn=['PUR','OPN'].includes(v.type);
 const it=findItemByCode(raw);
 if(it){if(it.serial)return{ok:0,msg:it.name+' is serial-tracked — scan the serial no. QR instead'};
  let l=v.lines.find(x=>x.itemId===it.id&&!x.batch);if(!l){l=newLineFor(it);insertLine(l)}l.qty=num(l.qty)+1;CUR.dirty=true;CUR.redraw();return{ok:1,msg:it.name+' — Qty '+fq(l.qty)}}
 const idx=serialIndex(v.id);const ser=extractSerials(raw);
 if(!ser.length){
  const pal=Object.values(idx).filter(r=>r.pallet&&r.pallet.toLowerCase()===raw.toLowerCase());
  if(pal.length&&isOut){const av=pal.filter(r=>r.status==='In Stock'&&r.g===v.godownId);let n=0;for(const r of av){const x=await addSerial(r.s,idx,{});if(x.ok)n++}CUR.redraw();return{ok:n>0,msg:`Pallet ${raw}: ${n} serial(s) added`+(pal.length-av.length?` (${pal.length-av.length} not in stock here)`:'')}}
  if(isIn){const id=await askItem(null,raw);
   if(id==='PALLET'){CUR.pallet=raw;const p=$('#e_pal');if(p)p.value=raw;saveDraft();return{ok:1,msg:'Pallet / Box No. set to '+raw+' — now scan its serials'}}
   if(id){const x=I(id);let l=v.lines.find(y=>y.itemId===id&&!y.batch);if(!l){l=newLineFor(x);insertLine(l)}l.qty=num(l.qty)+1;CUR.dirty=true;CUR.redraw();return{ok:1,msg:'New barcode saved for '+x.name+' — Qty '+fq(l.qty)}}return{ok:0,msg:'Skipped: '+raw}}
  return{ok:0,msg:'Not found: '+raw+' (no product barcode / serial no. matched)'};
 }
 const hint=modelHint(raw,ser);let n=0,errs=[];
 for(const s of ser){const r=await addSerial(s,idx,hint);if(r.ok)n++;else errs.push(r.msg)}
 CUR.redraw();
 if(ser.length===1)return n?{ok:1,msg:ser[0]+' added → '+(I(lineOfSerial(ser[0]).itemId)||{}).name}:{ok:0,msg:errs[0]};
 return{ok:n>0,msg:`${n} of ${ser.length} serials added`+(errs.length?' • '+errs.length+' rejected: '+errs.slice(0,3).join(' | '):'')};
}
/* stock received without serials (e.g. from supplier invoice) — serials are attached when the panel is scanned out */
function pendingBal(itemId,g,idx,exV){const sIn=Object.values(idx).filter(r=>r.itemId===itemId&&r.status==='In Stock'&&r.g===g).length;return stockOf(itemId,g,exV)-sIn}
function pendingItemFor(s,hint,v,idx){
 const used=id=>v.lines.filter(l=>l.itemId===id).reduce((a,l)=>a+(l.serials||[]).filter(o=>!idx[o.s]).length,0);
 const free=id=>pendingBal(id,v.godownId,idx,v.id)-used(id);
 let it=prefixItem(s)||(hint.item&&hint.item.serial?hint.item:null);
 if(!it){const c=DB.items.filter(i=>i.serial&&free(i.id)>0);if(c.length===1)it=c[0];else if(c.length>1)return{msg:`${s} is new and ${c.length} products have un-scanned stock here — set "Serial No. starts with" in Item Master so the system knows which product it is`}}
 if(!it)return{msg:`${s} not found in stock records`};
 if(free(it.id)<=0)return{msg:`${s}: no un-scanned ${it.name} stock left in this godown`};
 if(!(it.serialPrefixes||[]).length&&s.length>8){it.serialPrefixes=[s.slice(0,s.length-5)];touch('items',it);save(false)}
 return{it};
}
function lineOfSerial(s){return CUR.v.lines.find(l=>(l.serials||[]).some(o=>o.s===s))||{}}
function insertLine(l){const v=CUR.v;const e=v.lines.findIndex(x=>!x.itemId);if(e>=0)v.lines[e]=l;else v.lines.push(l)}
async function addSerial(s,idx,hint){
 const v=CUR.v;s=s.toUpperCase();
 if(v.lines.some(l=>(l.serials||[]).some(o=>o.s===s)))return{ok:0,msg:s+' already scanned in this entry'};
 const rec=idx[s];let itemId=null;
 if(['PUR','OPN'].includes(v.type)){
  if(rec&&['In Stock','In Transit'].includes(rec.status))return{ok:0,msg:`${s} is already ${rec.status} at ${gN(rec.g)}`};
  let it=rec?I(rec.itemId):(hint.item||prefixItem(s));
  if(!it&&hint.newName){it=findItemByCode(hint.newName)||createItemQuick(hint.newName);toast('New product auto-created: '+it.name,3000)}
  if(!it){const sel=v.lines.filter(l=>l.itemId&&(I(l.itemId)||{}).serial);if(sel.length===1)it=I(sel[0].itemId)}
  if(!it){const id=await askItem(s);it=id&&I(id)}
  itemId=it&&it.id;
 }else if(v.type==='SRT'){
  if(rec&&rec.status==='In Stock')return{ok:0,msg:`${s} is already In Stock at ${gN(rec.g)}`};
  if(rec&&rec.status!=='Sold')return{ok:0,msg:`${s} status is ${rec.status} — cannot return`};
  if(rec&&rec.outV&&v.partyId&&rec.outV.partyId!==v.partyId)toast(`Note: ${s} was sold to ${pN(rec.outV.partyId)}`,3500);
  let it=rec?I(rec.itemId):prefixItem(s);if(!it){const id=await askItem(s);it=id&&I(id)}itemId=it&&it.id;
 }else{
  if(!rec){const pi=pendingItemFor(s,hint,v,idx);if(!pi.it)return{ok:0,msg:pi.msg};itemId=pi.it.id}
  else{if(rec.status!=='In Stock'||rec.g!==v.godownId)return{ok:0,msg:`${s} is ${rec.status}${rec.g?' @ '+gN(rec.g):''} — not available in this godown`};
  itemId=rec.itemId}
 }
 if(!itemId)return{ok:0,msg:s+' skipped (no product selected)'};
 const it=I(itemId);if(!it.serial){it.serial=true;touch('items',it)}
 let l=v.lines.find(x=>x.itemId===itemId);if(!l){l=newLineFor(it);insertLine(l)}
 l.serials=l.serials||[];l.serials.push({s,p:['PUR','OPN'].includes(v.type)?(CUR.pallet||''):((rec&&rec.pallet)||'')});l.qty=INT.includes(v.type)?Math.max(num(l.qty),l.serials.length):l.serials.length;CUR.dirty=true;
 return{ok:1,msg:s};
}
/* new serial or unknown barcode → choose product or create one (Product Name, Brand, Category) */
function askItem(serial,barcode){return new Promise(res=>{let done=false;const fin=id=>{if(done)return;done=true;res(id)};
 const code=serial||barcode;const pre=serial&&serial.length>8?serial.slice(0,serial.length-5):'';
 const cats=[...new Set(DB.items.map(i=>i.group).filter(Boolean))],brands=[...new Set(DB.items.map(i=>i.brand).filter(Boolean))];
 const m=modal(`<h3 style="margin-top:0">🆕 New ${serial?'serial no.':'barcode'}: <code>${esc(code)}</code></h3><p class="mut">This code is not linked to any product yet. Pick the product, or create a new one — next time it is added automatically.</p>
 <div class="f" style="margin-bottom:12px"><label>Existing product</label><input id="aq_i" placeholder="Search product / brand…"></div>
 <div class="mut" style="text-align:center;margin:6px 0 10px">— or create a new product —</div>
 <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px"><div class="f" style="grid-column:1/-1"><label>Product Name *</label><input id="aq_n"></div><div class="f"><label>Brand Name</label><input id="aq_b" list="aq_bl"><datalist id="aq_bl">${brands.map(b=>`<option>${esc(b)}</option>`).join('')}</datalist></div><div class="f"><label>Product Category</label><input id="aq_c2" list="aq_cl"><datalist id="aq_cl">${cats.map(b=>`<option>${esc(b)}</option>`).join('')}</datalist></div></div>
 ${serial?`<label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="aq_rm" checked> Auto-link future serials starting with <input id="aq_p" value="${esc(pre)}" style="width:170px;font-family:monospace"></label>`:''}
 <div class="btns" style="justify-content:flex-end;margin-top:14px">${!serial&&['PUR','OPN'].includes((CUR&&CUR.v.type)||'')?'<button class="btn" id="aq_pal">It is a Pallet / Box No.</button>':''}<button class="btn" id="aq_skip">Skip</button><button class="btn p" id="aq_c">Create &amp; Add</button></div>`);
 m._onclose=()=>fin(null);
 const link=it=>{if(serial){if(m.querySelector('#aq_rm').checked){const p=m.querySelector('#aq_p').value.trim().toUpperCase();if(p){it.serialPrefixes=[...new Set([...(it.serialPrefixes||[]),p])];touch('items',it)}}}else if(!it.code){it.code=barcode;touch('items',it)}save(false)};
 picker(m.querySelector('#aq_i'),itemSrc(null,null),o=>{const it=I(o.id);if(!serial&&it.code&&it.code!==barcode){toast('This product already has barcode '+it.code);return}link(it);fin(it.id);m.close()});
 m.querySelector('#aq_skip').onclick=()=>{fin(null);m.close()};
 if(m.querySelector('#aq_pal'))m.querySelector('#aq_pal').onclick=()=>{fin('PALLET');m.close()};
 m.querySelector('#aq_c').onclick=()=>{const g=k=>m.querySelector('#aq_'+k).value.trim();if(!g('n'))return toast('Enter the product name');if(DB.items.some(x=>x.name.toLowerCase()===g('n').toLowerCase()))return toast('A product with this name already exists — pick it above');
  const it=createItemQuick(g('n'),{brand:g('b'),group:g('c2'),serial:!!serial,alias:''});link(it);fin(it.id);m.close()};
 setTimeout(()=>m.querySelector('#aq_i').focus(),50);
})}
function pasteSerials(){
 const m=modal(`<h3 style="margin-top:0">📋 Paste / Import Serial Numbers</h3><p class="mut">Paste the serial list from the supplier packing list / Excel (any layout — serials are detected automatically), or choose an Excel / CSV file.</p>
 <textarea id="ps_t" rows="8" placeholder="AB12345678901234&#10;AB12345678901235&#10;…"></textarea>
 <div class="row" style="margin-top:10px"><div class="f"><label>Excel / CSV file</label><input type="file" id="ps_f" accept=".xlsx,.xls,.csv,.txt"></div>${['PUR','OPN'].includes(CUR.v.type)?`<div class="f"><label>Pallet / Box No. for these serials</label><input id="ps_p" value="${esc(CUR.pallet)}"></div>`:''}</div>

function saveEntry(){
 const v=CUR.v;const keep=v.lines;v.lines=v.lines.filter(l=>l.itemId);
 const fail=m=>{v.lines=keep;toast(m,4500);return false};
 if(!v.lines.length)return fail('Scan or add at least one product');
 for(const l of v.lines){const it=I(l.itemId);if(it.serial){if(OUTT.includes(v.type)){if(!(l.serials||[]).length)return fail(`${it.name}: scan the serial numbers of panels going out`);l.qty=l.serials.length}else l.qty=Math.max(num(l.qty),(l.serials||[]).length)}if(num(l.qty)<=0)return fail(`${it.name}: qty must be more than 0`)}
 for(const[k,l,,rq]of(FIELDS[v.type]||[]))if(rq&&!v[k])return fail(l+' is required');
 if(!v.date)return fail('Enter the date');
 if(!isAdmin()&&v.date>today())return fail('Future date is not allowed');
 if(v.refNo&&v.partyId&&DB.vouchers.some(x=>!x.deleted&&x.id!==v.id&&x.type===v.type&&x.partyId===v.partyId&&(x.refNo||'').toLowerCase()===v.refNo.toLowerCase()))return fail(`Duplicate: ${v.refNo} is already entered for this party`);
 const all=v.lines.flatMap(l=>(l.serials||[]).map(o=>o.s));if(new Set(all).size!==all.length)return fail('Duplicate serial numbers in this entry');
 if(all.length){const idx=serialIndex(v.id);const unk={};for(const s of all){const r=idx[s];
  if(OUTT.includes(v.type)&&!r){const li=v.lines.find(l=>(l.serials||[]).some(o=>o.s===s));unk[li.itemId]=(unk[li.itemId]||0)+1;continue}
  if(OUTT.includes(v.type)&&(r.status!=='In Stock'||r.g!==v.godownId))return fail(`${s} is not in stock at this godown`);
  if(['PUR','OPN'].includes(v.type)&&r&&['In Stock','In Transit'].includes(r.status))return fail(`${s} is already ${r.status}`);}
  for(const id in unk){const pb=pendingBal(id,v.godownId,idx,v.id);if(unk[id]>pb)return fail(`${I(id).name}: ${unk[id]} new serial(s) but only ${fq(pb)} un-scanned qty in stock at this godown`)}}
 if(OUTT.includes(v.type)&&!DB.meta.allowNeg){const need={};v.lines.forEach(l=>need[l.itemId]=(need[l.itemId]||0)+num(l.qty));
  for(const id in need){const a=stockOf(id,v.godownId,v.id);if(need[id]>a+1e-9)return fail(`⛔ ${I(id).name}: only ${fq(a)} in stock, cannot take out ${fq(need[id])}`)}}
 const isNew=!v.id;const old=isNew?null:DB.vouchers.find(x=>x.id===v.id);
 if(isNew){v.id=uid('V');v.createdBy=ME.username;v.createdAt=Date.now();if(v.type==='TRF')v.status='In Transit'}else{v.editedBy=ME.username;v.editedAt=Date.now()}
 v.lines.forEach(l=>{l.qty=num(l.qty);delete l._open});
 const T2=vTotals(v);
 put('vouchers',JSON.parse(JSON.stringify(v)));
 log(isNew?'CREATE':'EDIT',`${v.vno} ${T[v.type].s}${v.refNo?' | '+v.refNo:''} | ${v.lines.length} products | Qty ${fq(T2.qty)}${all.length?' | '+all.length+' serials':''}`+(old?` | OLD: qty ${fq(old.lines.reduce((a,l)=>a+num(l.qty),0))}, ref ${old.refNo||''}, date ${old.date}`:''),v.godownId);
 save();clearDraft();const id=v.id,ty=v.type;CUR=null;toast('✓ Saved: '+v.vno+' — '+fq(T2.qty)+' qty');
 if(confirm(`Saved (${v.vno}) — ${fq(T2.qty)} qty.\n\nCreate another ${T[ty].n} entry?`))go('entry',{type:ty});else{go('vouchers');viewV(id)}
 return true;
}

 const rows=(v.lines||[]).map((l,i)=>{const it=I(l.itemId)||{};return{sn:i+1,item:it.name||'?',brand:it.brand||'',cat:it.group||'',batch:(l.serials||[]).length?(l.serials.length+' serials'):(l.batch||it.code||''),qty:l.qty,recv:l.recvQty,book:l.book}});
 const cols=[{k:'sn',l:'#'},{k:'item',l:'Product'},{k:'brand',l:'Brand'},{k:'cat',l:'Category'},{k:'batch',l:'Serial / Barcode'},{k:'qty',l:v.type==='PHY'?'Physical Qty':'Qty',n:1,t:1}];
 if(v.type==='TRF'&&v.status==='Received')cols.push({k:'recv',l:'Received',n:1,t:1});if(v.type==='PHY')cols.push({k:'book',l:'Book Qty',n:1,t:1});
 const p=Pt(v.partyId);
 const kv=[['Voucher No.',v.vno],['Date',dmy(v.date)],[v.type==='TRF'?'From Godown':'Godown',gN(v.godownId)],v.type==='TRF'&&['To Godown',gN(v.toGodownId)],p&&['Party',p.name],p&&p.gstin&&['Party GSTIN',p.gstin],
  v.refNo&&[REFL[v.type]||'Ref No.',v.refNo],v.invDate&&['Invoice / Note Date',dmy(v.invDate)],v.refNo2&&['Against Invoice',v.refNo2],v.ewb&&['e-Way Bill No.',v.ewb],v.dcNo&&[v.type==='SAL'?'Delivery Challan No.':v.type==='TRF'?'Transfer Challan No.':'Packing List / DC No.',v.dcNo],
  v.vehicle&&['Vehicle No.',v.vehicle],v.lr&&['LR / GR No.',v.lr],v.transporter&&['Transporter / Dispatched Through',v.transporter],v.orderNo&&['Buyer Order / Reference',v.orderNo],v.reason&&['Reason',v.reason],
  v.type==='TRF'&&['Status',v.status+(v.recvBy?' by '+v.recvBy+' on '+dmy(v.recvDate):'')],v.recvRemark&&['Receipt Remark',v.recvRemark],
  ['Entered By',v.createdBy+' • '+new Date(v.createdAt).toLocaleString('en-IN')],v.editedBy&&['Last Edited',v.editedBy+' • '+new Date(v.editedAt).toLocaleString('en-IN')]].filter(Boolean);
 return{cols,rows,kv,tot:vTotals(v)};
}

  if(INT.includes(v.type)){const idx=serialIndex(v.id);const used=v.lines.flatMap(l=>(l.serials||[]).map(o=>o.s)).filter(s=>idx[s]&&idx[s].hist.some(x=>x.date>=v.date));if(used.length)return alert('Cannot delete: '+used.length+' serial(s) from this entry are already used in later entries (e.g. '+used[0]+').')}

 if(m.querySelector('#vrc'))m.querySelector('#vrc').onclick=()=>{m.close();receiveV(v.id)};

 <div class="tw"><table><thead><tr><th>Item</th><th class="n">Sent</th><th class="n">Received Qty</th></tr></thead><tbody>${v.lines.map((l,i)=>`<tr><td>${esc((I(l.itemId)||{}).name)}${(l.serials||[]).length?`<div class="chips" style="margin-top:6px">${l.serials.map(o=>`<label class="chip"><input type="checkbox" class="rs" data-i="${i}" value="${esc(o.s)}" checked> ${esc(o.s)}</label>`).join('')}</div>`:''}</td><td class="n">${fq(l.qty)}</td><td class="n"><input type="number" step="any" class="rq" data-i="${i}" value="${l.qty}" style="width:100px;text-align:right" ${(l.serials||[]).length?'readonly':''}></td></tr>`).join('')}</tbody></table></div>

   ${S.unknown.length?`<div class="warnbox" style="margin-top:10px">⚠ Scanned serials that do NOT belong to this godown's stock: ${esc(S.unknown.join(', '))}</div>`:''}

  $$('.phq').forEach(x=>x.onchange=e=>{S.lines[+x.dataset.i].qty=num(e.target.value);draw()});

/* serial-wise stock rows: one row per panel in stock (+ non-serial products as one row, + un-scanned qty) */
function serialStockRows(gs){const S=new Set(gs);const idx=serialIndex();const rows=[];
 Object.values(idx).filter(r=>r.status==='In Stock'&&S.has(r.g)).forEach(r=>{const it=I(r.itemId)||{};const i=r.inV||r.srtV||r.trV||{};
  rows.push({g:gN(r.g),item:it.name||'?',brand:it.brand||'',cat:it.group||'',code:r.s,pallet:r.pallet||'',qty:1,inDate:dmy(i.date),inType:i.type?T[i.type].s:'',inRef:i.refNo||'',sup:pN(i.partyId),_click:`serialCard('${r.s}')`})});
 summary(gs,'1900-01-01','9999-12-31',true).forEach(r=>{const it=I(r.itemId)||{};if(r.cl<=0)return;
  if(it.serial){const n=Object.values(idx).filter(x=>x.itemId===r.itemId&&x.status==='In Stock'&&x.g===r.godownId).length;const pend=r.cl-n;
   if(pend>0)rows.push({g:gN(r.godownId),item:it.name,brand:it.brand||'',cat:it.group||'',code:'(serial not scanned yet)',pallet:'',qty:pend,inDate:'',inType:'',inRef:'',sup:''})}
  else rows.push({g:gN(r.godownId),item:it.name,brand:it.brand||'',cat:it.group||'',code:it.code||'(no barcode)',pallet:'',qty:r.cl,inDate:'',inType:'',inRef:'',sup:''})});
 rows.sort((a,b)=>a.g.localeCompare(b.g)||a.item.localeCompare(b.item)||a.code.localeCompare(b.code));rows.forEach((r,k)=>r.sn=k+1);return rows}

function tallyMatch(rows,gSel,asOn){
 let h=rows.findIndex(r=>r.some(c=>/particular|item|name|product/i.test(c))&&r.some(c=>/qty|quantity|closing|balance|stock/i.test(c)));
 let ni=0,qi=1,gi=-1;if(h>=0){const H=rows[h].map(c=>String(c).toLowerCase());ni=H.findIndex(c=>/particular|item|name|product/.test(c));gi=H.findIndex(c=>/godown|location|warehouse/.test(c));
  qi=H.findIndex(c=>/closing.*q|qty|quantity/.test(c));if(qi<0)qi=H.findIndex(c=>/closing|balance|stock/.test(c));rows=rows.slice(h+1)}
 else if(rows[0]&&rows[0].length>=3&&rows[0][1]&&isNaN(parseFloat(rows[0][1]))){gi=1;qi=2}
 const nameMap={};DB.items.forEach(i=>[i.name,i.alias,i.code].forEach(x=>{if(x)nameMap[String(x).trim().toLowerCase()]=i}));
 const gMap={};DB.godowns.forEach(g=>{gMap[g.name.toLowerCase()]=g;gMap[g.code.toLowerCase()]=g});
 const findG=s=>{s=String(s||'').trim().toLowerCase();if(!s)return null;return gMap[s]||DB.godowns.find(g=>g.name.toLowerCase().includes(s)||s.includes(g.name.toLowerCase().replace(/^(branch office|warehouse|head office)\s*:?\s*/,'')))};
 const tally={},unk=[];
 rows.forEach(r=>{const n=String(r[ni]||'').trim();if(!n||/^(grand )?total$/i.test(n))return;if(qi<0||r[qi]===undefined||String(r[qi]).trim()==='')return;const q=num(r[qi]);
  const g=gi>=0?findG(r[gi]):null;const gid=g?g.id:(gSel||'ALL');const it=nameMap[n.toLowerCase()];
  if(!it){unk.push({n,g:g?g.name:(gSel==='ALL'?'All Godowns':gN(gSel)),q});return}const k=it.id+'|'+gid;tally[k]=(tally[k]||0)+q});
 const gIds=new Set(Object.keys(tally).map(k=>k.split('|')[1]));const out=[];
 gIds.forEach(gid=>{const gs=gid==='ALL'?myG():[gid];const s=summary(gs,'1900-01-01',asOn,false);const seen=new Set();
  Object.keys(tally).filter(k=>k.endsWith('|'+gid)).forEach(k=>{const id=k.split('|')[0];seen.add(id);const it=I(id);const a=(s.find(r=>r.itemId===id)||{}).cl||0;const d=a-tally[k];
   out.push({item:it.name,brand:it.brand||'',g:gid==='ALL'?'All Godowns':gN(gid),tq:tally[k],aq:a,diff:d,st:Math.abs(d)<0.001?'Matched':d<0?'Short in Godown':'Excess in Godown'})});
  s.filter(r=>!seen.has(r.itemId)&&Math.abs(r.cl)>0.001).forEach(r=>{const it=I(r.itemId);out.push({item:it.name,brand:it.brand||'',g:gid==='ALL'?'All Godowns':gN(gid),tq:0,aq:r.cl,diff:r.cl,st:'Not in Tally'})})});
 unk.forEach(u=>out.push({item:u.n,brand:'',g:u.g,tq:u.q,aq:0,diff:-u.q,st:'Not in Item Master'}));
 out.sort((a,b)=>(a.st==='Matched')-(b.st==='Matched')||Math.abs(b.diff)-Math.abs(a.diff));
 const cols=[{k:'item',l:'Product'},{k:'brand',l:'Brand'},{k:'g',l:'Godown'},{k:'tq',l:'Tally Qty',n:1,t:1},{k:'aq',l:'Godown App Qty',n:1,t:1},{k:'diff',l:'Difference (App − Tally)',n:1,t:1,f:v=>`<b class="${v<0?'neg':v>0?'pos':''}">${fq(v)}</b>`},{k:'st',l:'Status',f:v=>`<span class="tag ${v==='Matched'?'ok':/Short|Master/.test(v)?'bad':'warn'}">${v}</span>`}];
 REPORT={title:'Tally vs Godown Stock Match',sub:'As on '+dmy(asOn),cols,rows:out};
 const mis=out.filter(r=>r.st!=='Matched');log('TALLY MATCH',out.length+' products | '+mis.length+' differences','');save();
 $('#tout').innerHTML=`<div class="grid kpis" style="margin-bottom:14px"><div class="kpi" style="--c:#15803d"><small>Matched</small><b>${out.length-mis.length}</b></div><div class="kpi" style="--c:#c62828"><small>Differences</small><b>${mis.length}</b></div><div class="kpi" style="--c:#b45309"><small>Short Qty</small><b>${fq(mis.filter(r=>r.diff<0).reduce((a,r)=>a-r.diff,0))}</b></div><div class="kpi" style="--c:#7c3aed"><small>Excess Qty</small><b>${fq(mis.filter(r=>r.diff>0).reduce((a,r)=>a+r.diff,0))}</b></div></div>
 <div class="card"><h3>⚖ Result — As on ${dmy(asOn)}</h3>${table(cols,out)}<p class="mut" style="font-size:12px"><b>Short in Godown</b> = Tally shows more than the godown app (missing goods / goods out without entry / possible theft). <b>Excess in Godown</b> = godown has more (Tally entry pending). <b>Not in Tally</b> = godown has stock but the product is not in the Tally file.</p></div>`;
}

function askReason(what){const r=prompt('Delete: '+what+'\n\nReason for deleting (saved in the Deleted log / Google Sheet):');return r&&r.trim()?r.trim():null}
function recDel(kind,o){const d={id:uid('D'),t:new Date().toISOString(),by:ME.username,role:isAdmin()?'Admin':'Godown Manager',kind,party:o.party||'',product:o.product||'',code:o.code||'',godownId:o.godownId||'',ref:o.ref||'',qty:o.qty||'',reason:o.reason||'',extra:o.extra||''};
 DB.deletions.push(d);touch('deletions',d);log('DELETE '+kind.toUpperCase(),[o.party,o.product,o.code,o.extra,'Reason: '+o.reason].filter(Boolean).join(' | '),o.godownId||'');save()}
const myItemIds=()=>{if(isAdmin())return null;const S=new Set();DB.vouchers.forEach(v=>{if(!v.deleted&&(v.godownId===ME.godownId||v.toGodownId===ME.godownId))(v.lines||[]).forEach(l=>S.add(l.itemId))});return S};
const scopeItems=L=>{const S=myItemIds();return S?L.filter(i=>S.has(i.id)):L};
function usedElsewhere(id){return!isAdmin()&&DB.vouchers.some(v=>!v.deleted&&v.godownId!==ME.godownId&&v.toGodownId!==ME.godownId&&(v.lines||[]).some(l=>l.itemId===id))}
function renField(field,label,old){if(!old)return toast('Select a '+label.toLowerCase());const L=scopeItems(DB.items.filter(i=>!i.deleted&&(i[field]||'')===old));if(!L.length)return toast('No product of your godown has this '+label.toLowerCase());
 const nv=(prompt(`Rename ${label} "${old}" to:\n\n(${L.length} product(s)${isAdmin()?'':' of your godown'} will change)`,old)||'').trim();if(!nv||nv===old)return;
 L.forEach(i=>{i[field]=nv;touch('items',i)});log('EDIT '+label.toUpperCase(),`${label}: "${old}" → "${nv}" | ${L.length} product(s): ${L.map(i=>i.name).slice(0,10).join('; ')}`);save();toast(`✓ ${label} renamed: ${old} → ${nv}`);render()}
function delParty(id){const p=Pt(id);if(!p)return false;const n=DB.vouchers.filter(v=>!v.deleted&&v.partyId===id).length;
 if(!confirm(`Delete party "${p.name}"?`+(n?`\n\nIt is used in ${n} entries — those entries stay as they are (party name is kept in history), but the party will no longer appear in lists.`:'')))return false;
 const r=askReason('Party '+p.name);if(!r)return false;p.deleted=true;touch('parties',p);recDel('Party',{party:p.name,code:p.gstin||'',reason:r,extra:n?'Used in '+n+' entries':''});toast('🗑 Party deleted: '+p.name);render();return true}
function delItem(id){const it=I(id);if(!it)return false;if(usedElsewhere(id)){alert(`"${it.name}" is also used in other godowns — only the Admin can delete it.\n\nYou can still edit its name / brand / category.`);return false}const st=summary(DB.godowns.map(g=>g.id),'1900-01-01','9999-12-31',true).filter(r=>r.itemId===id&&Math.abs(r.cl)>1e-9);
 if(st.length){alert(`Cannot delete "${it.name}" — it still has stock:\n\n`+st.map(r=>gN(r.godownId)+': '+fq(r.cl)).join('\n')+'\n\nMake the stock zero first (sale / damage / transfer entry).');return false}
 if(!confirm(`Delete product "${it.name}"?\n\nOld entries keep their history; the product will no longer appear in lists or scanning.`))return false;
 const r=askReason('Product '+it.name);if(!r)return false;it.deleted=true;it.active=false;touch('items',it);recDel('Product',{product:it.name,code:it.serial?((it.serialPrefixes||[]).join(', ')||'serial-tracked'):(it.code||''),reason:r,extra:bcat(it)});toast('🗑 Product deleted: '+it.name);render();return true}
function delField(field,label,val){if(!val)return toast('Select a '+label.toLowerCase());const L=scopeItems(DB.items.filter(i=>!i.deleted&&(i[field]||'')===val));if(!L.length)return toast('No product of your godown has this '+label.toLowerCase());
 if(!confirm(`Delete ${label} "${val}"?\n\n${L.length} product(s) will have their ${label} cleared. Products and stock are NOT deleted.`))return;
 const r=askReason(label+' '+val);if(!r)return;L.forEach(i=>{i[field]='';touch('items',i)});recDel(label,{product:label+': '+val,reason:r,extra:L.length+' product(s) cleared: '+L.map(i=>i.name).slice(0,10).join('; ')});toast(`🗑 ${label} deleted: ${val}`);render()}
function delCode(raw){raw=String(raw||'').trim();if(!raw)return toast('Enter or scan a barcode / serial no.');
 const it=DB.items.find(i=>!i.deleted&&(i.code||'').toLowerCase()===raw.toLowerCase());
 if(it){if(!confirm(`Remove barcode ${it.code} from product "${it.name}"?\n\nThe product and its stock stay; only the barcode is removed.`))return;const r=askReason('Barcode '+it.code);if(!r)return;const c=it.code;it.code='';touch('items',it);recDel('Barcode',{product:it.name,code:c,reason:r});toast('🗑 Barcode removed: '+c);render();return}
 const s=(extractSerials(raw)[0]||raw).toUpperCase();const rec=serialIndex()[s];
 if(!rec)return toast('Not found: '+raw+' (no product barcode or serial no. matches)',4000);
 if(rec.hist.length>1)return alert(`Cannot delete serial ${s} — it is already used in later entries:\n\n`+rec.hist.map(v=>dmy(v.date)+'  '+v.vno+'  '+T[v.type].n).join('\n')+'\n\nDelete / edit those entries first.');
 const v=rec.hist[0];if(!isAdmin()&&v.godownId!==ME.godownId)return alert(`Serial ${s} belongs to ${gN(v.godownId)} — you can only change your own godown's stock.`);const l=v.lines.find(x=>(x.serials||[]).some(o=>o.s===s));const itm=I(l.itemId)||{};
 if(!confirm(`Delete serial no. ${s}?\n\nProduct: ${itm.name}\nEntry: ${v.vno} ${v.refNo||''} (${T[v.type].n}) @ ${gN(v.godownId)}\n\nThis panel will be removed from that entry and stock goes down by 1.`))return;
 const r=askReason('Serial No. '+s);if(!r)return;
 l.serials=l.serials.filter(o=>o.s!==s);l.qty=Math.max(l.serials.length,num(l.qty)-1);
 if(!(num(l.qty)>0))v.lines=v.lines.filter(x=>x!==l);
 if(!v.lines.length){v.deleted=true;v.deletedBy=ME.username;v.deletedRole=isAdmin()?'Admin':'Godown Manager';v.deletedAt=new Date().toISOString();v.deleteReason='Last serial deleted: '+r}
 v.editedBy=ME.username;v.editedAt=Date.now();touch('vouchers',v);
 recDel('Serial No.',{product:itm.name,code:s,godownId:v.godownId,ref:v.vno+(v.refNo?' / '+v.refNo:''),qty:1,reason:r});toast('🗑 Serial deleted: '+s);render()}

  .concat(DB.vouchers.filter(v=>v.deleted).map(v=>({t:v.deletedAt||'',kind:T[v.type].n+' entry',what:[pN(v.partyId),v.lines.map(l=>(I(l.itemId)||{}).name).join(', ')].filter(Boolean).join(' / '),code:v.lines.flatMap(l=>(l.serials||[]).map(o=>o.s)).join(', '),g:gN(v.godownId),ref:v.vno+(v.refNo?' / '+v.refNo:''),qty:v.lines.reduce((a,l)=>a+num(l.qty),0),reason:v.deleteReason||'',extra:'',by:v.deletedBy||'',role:v.deletedRole||''})))
  .sort((a,b)=>String(b.t).localeCompare(String(a.t))).map(r=>({...r,t:r.t?new Date(r.t).toLocaleString('en-IN'):''}));
 const cols=[{k:'t',l:'Deleted On'},{k:'by',l:'Deleted By'},{k:'role',l:'Role'},{k:'kind',l:'What',f:v=>`<span class="tag bad">${esc(v)}</span>`,x:v=>v},{k:'what',l:'Party / Product / Category'},{k:'code',l:'Barcode / Serial Nos.',f:v=>`<span style="font-family:monospace;font-size:11px;white-space:normal;display:block;max-width:280px">${esc(v)}</span>`,x:v=>v},{k:'g',l:'Godown'},{k:'ref',l:'Entry / Ref'},{k:'qty',l:'Qty',n:1,f:v=>v===''||v==null?'':fq(v)},{k:'reason',l:'Reason'},{k:'extra',l:'Details'}];
 $('#dlog').innerHTML=table(cols,rows);$('#dlx').onclick=()=>exportXL('Delete_Log_'+today(),cols,rows,'Deleted');

 const cats=[...new Set(DB.items.map(i=>i.group).filter(Boolean))],brands=[...new Set(DB.items.map(i=>i.brand).filter(Boolean))];

 const m=modal(`<h3 style="margin-top:0">${id?'Edit':'New'} Product</h3><div class="grid" style="grid-template-columns:1fr 1fr;gap:12px">
  <div class="f" style="grid-column:1/-1"><label>Product Name *</label><input id="it_name" value="${esc(it.name)}"></div>

  <div class="f"><label>Unit</label><input id="it_unit" list="it_ul" value="${esc(it.unit||'Pcs')}" placeholder="Pcs"><datalist id="it_ul">${UNITS.map(u=>`<option>${u}</option>`).join('')}</datalist></div>

  <div class="f"><label>Qty (current stock)</label><input value="${id?fu(it,stk):'0'}" readonly title="Qty changes only through stock entries (scan IN / OUT)"></div>
  <div class="f"><label>Status</label><select id="it_active"><option value="1">Active</option><option value="0" ${it.active===false?'selected':''}>Inactive</option></select></div></div>

 m.querySelector('#it_serial').onchange=sw;m.querySelector('#it_code').oninput=bc;sw();m.querySelector('#it_unit').oninput=e=>{m.querySelector('#it_ub').textContent=e.target.value.trim()||'Pcs'};

async function importEntryFile(inp){const f=inp.files[0];if(!f)return;let d;try{d=JSON.parse(await f.text())}catch(e){return toast('Invalid file')}inp.value='';
 if(d.format!=='gsm-entries-v1')return toast('This is not a stock entry file');if(!isAdmin())return toast('Only the admin can load entry files');
 const r=applyEntryData(d,f.name);
 alert(`Entry file loaded\n\nNew products: ${r.ni}\nNew parties: ${r.np}\nEntries added: ${r.nv}\n\n${r.done.join('\n')}`+(r.skip.length?`\n\nSkipped (${r.skip.length}):\n`+r.skip.slice(0,12).join('\n'):''));go('r_summary');
}
function applyEntryData(d,src){
 const im={},pm={};let ni=0,np=0,nv=0;const skip=[],done=[];const lc=x=>String(x||'').trim().toLowerCase();
 (d.items||[]).forEach(x=>{let it=DB.items.find(i=>lc(i.name)===lc(x.name)||(x.alias&&lc(i.alias)===lc(x.alias)));
  if(!it){it={id:uid('I'),unit:'Nos',active:true,code:'',alias:'',brand:'',group:'',serial:false,serialPrefixes:[],...x};delete it.key;put('items',it);ni++}
  else{if(x.serial)it.serial=true;if(x.serialPrefixes)it.serialPrefixes=[...new Set([...(it.serialPrefixes||[]),...x.serialPrefixes])];if(!it.brand&&x.brand)it.brand=x.brand;if(!it.group&&x.group)it.group=x.group;touch('items',it)}
  im[x.key]=it.id});
 (d.parties||[]).forEach(x=>{let p=DB.parties.find(q=>lc(q.name)===lc(x.name)||(x.gstin&&lc(q.gstin)===lc(x.gstin)));if(!p){p={id:uid('P'),...x};delete p.key;put('parties',p);np++}pm[x.key]=p.id});
 const idx=serialIndex();
 (d.vouchers||[]).forEach(x=>{const g=DB.godowns.find(g=>g.code===x.godownCode);if(!g){skip.push('Godown code '+x.godownCode+' not found');return}
  const partyId=x.party?pm[x.party]:'';
  if(x.refNo&&DB.vouchers.some(v=>!v.deleted&&v.type===x.type&&v.partyId===partyId&&lc(v.refNo)===lc(x.refNo))){skip.push(T[x.type].n+' '+x.refNo+' is already entered');return}
  if(x.type==='OPN'&&!x.refNo&&(x.lines||[]).every(l=>(l.serials||[]).length&&(l.serials||[]).every(o=>idx[o.s]))){skip.push('Opening stock serials are already in the system');return}
  const lines=(x.lines||[]).map(l=>{const ser=(l.serials||[]).filter(o=>{const r=idx[o.s];if(r&&['In Stock','In Transit'].includes(r.status)){skip.push(o.s+' already '+r.status);return false}return true});return{itemId:im[l.item],qty:Math.max(num(l.qty),ser.length),batch:'',serials:ser}}).filter(l=>l.itemId&&l.qty>0);
  if(!lines.length)return;
  const v={id:uid('V'),type:x.type,date:x.date,godownId:g.id,vno:nextVno(x.type,g.id),partyId,lines,createdBy:ME?ME.username:'admin',createdAt:Date.now()};
  ['refNo','refNo2','invDate','ewb','vehicle','dcNo','lr','transporter','orderNo','narration','reason'].forEach(k=>{if(x[k])v[k]=x[k]});
  put('vouchers',v);nv++;done.push(`${v.vno} — ${T[v.type].n}${v.refNo?' '+v.refNo:''}: ${fq(vTotals(v).qty)} qty (${vTotals(v).serials} serials) @ ${g.name}`)});
 log('IMPORT ENTRIES',src+' | '+nv+' entries | '+ni+' new products','');save();
 return{ni,np,nv,done,skip};
}
function tplDL(k){exportXL('Template_'+k,TPL[k].map((l,i)=>({k:'c'+i,l})),[],k)}
async function doImport(k,inp){const f=inp.files[0];if(!f)return;let rows;try{rows=await readFileTable(f)}catch(e){return toast('Read failed: '+e.message+' — try CSV',4000)}
 const h=rows.findIndex(r=>r.some(c=>/name|particular|item|product|party/i.test(c)));if(h<0)return toast('Header row not found');const H=rows[h].map(c=>String(c).toLowerCase().trim());const body=rows.slice(h+1);
 const col=(...re)=>H.findIndex(c=>re.some(r=>r.test(c)));let n=0,u=0,er=[];
 if(k==='items'){const ci={name:col(/product name|item name|^name|particular/),brand:col(/brand/),group:col(/categ|group|under/),ser:col(/serial track|tracked/),pre:col(/starts|prefix/),code:col(/barcode|part ?no|^code/)};
  body.forEach(r=>{const nm=String(r[ci.name]||'').trim();if(!nm)return;const v=i=>i>=0?String(r[i]||'').trim():'';let it=DB.items.find(x=>x.name.toLowerCase()===nm.toLowerCase());
   const d={name:nm,brand:v(ci.brand),group:v(ci.group),code:v(ci.code)};if(ci.ser>=0&&v(ci.ser))d.serial=/^y/i.test(v(ci.ser));if(ci.pre>=0&&v(ci.pre))d.serialPrefixes=v(ci.pre).split(',').map(x=>x.trim().toUpperCase()).filter(Boolean);
   if(it){Object.keys(d).forEach(x=>{if(d[x]!=='')it[x]=d[x]});touch('items',it);u++}else{put('items',{id:uid('I'),unit:'Nos',active:true,serial:true,serialPrefixes:[],...d});n++}})}
 if(k==='parties'){const ci={name:col(/party|^name/),type:col(/type/),gstin:col(/gst/),address:col(/address/),city:col(/city/),phone:col(/phone|mobile/)};
  body.forEach(r=>{const nm=String(r[ci.name]||'').trim();if(!nm)return;const v=i=>i>=0?String(r[i]||'').trim():'';let p=DB.parties.find(x=>x.name.toLowerCase()===nm.toLowerCase());const d={name:nm,type:/supp/i.test(v(ci.type))?'Supplier':/both/i.test(v(ci.type))?'Both':'Customer',gstin:v(ci.gstin).toUpperCase(),address:v(ci.address),city:v(ci.city),phone:v(ci.phone)};
   if(p){Object.assign(p,d);touch('parties',p);u++}else{put('parties',{id:uid('P'),...d});n++}})}
 if(k==='opening'){const ci={name:col(/product|item|name|particular/),g:col(/godown|location/),q:col(/qty|quantity/),s:col(/serial/),p:col(/pallet|box/)};const by={};const date=$('#opd').value||fyStart();const idx=serialIndex();const seen=new Set();
  body.forEach((r,ix)=>{const nm=String(r[ci.name]||'').trim();if(!nm)return;const it=findItemByCode(nm);const gc=String(r[ci.g]||'').trim().toLowerCase();const g=DB.godowns.find(x=>x.code.toLowerCase()===gc||x.name.toLowerCase()===gc);const rn='Row '+(ix+h+2);
   if(!it){er.push(rn+': product "'+nm+'" not in Item Master');return}if(!g){er.push(rn+': godown "'+gc+'" is wrong');return}
   const L=by[g.id]=by[g.id]||[];
   const ss=ci.s>=0?(extractSerials(r[ci.s]).length?extractSerials(r[ci.s]):String(r[ci.s]||'').split(/[,;\s]+/).map(x=>x.trim().toUpperCase()).filter(Boolean)):[];
   if(it.serial||ss.length){if(!ss.length){er.push(rn+': '+it.name+' is serial-tracked — serial no. missing');return}
    let l=L.find(x=>x.itemId===it.id);if(!l){l={itemId:it.id,qty:0,serials:[]};L.push(l)}
    ss.forEach(s=>{if(seen.has(s)||(idx[s]&&idx[s].status==='In Stock')){er.push(rn+': duplicate serial '+s);return}seen.add(s);l.serials.push({s,p:ci.p>=0?String(r[ci.p]||'').trim():''})});l.qty=l.serials.length;if(!it.serial){it.serial=true;touch('items',it)}}
   else L.push({itemId:it.id,qty:num(r[ci.q]),serials:[]})});
  Object.keys(by).forEach(g=>{const lines=by[g].filter(l=>l.qty>0);if(!lines.length)return;put('vouchers',{id:uid('V'),type:'OPN',date,godownId:g,vno:nextVno('OPN',g),lines,createdBy:ME.username,createdAt:Date.now(),narration:'Imported opening stock'});n+=lines.length})}
 log('IMPORT',k+' | new '+n+' | updated '+u+(er.length?' | errors '+er.length:''),'');save();inp.value='';
 alert(`Import complete (${k})\nNew: ${n}\nUpdated: ${u}`+(er.length?`\n\nErrors (${er.length}):\n`+er.slice(0,15).join('\n'):''));
}

 m.querySelector('#gu_s').onclick=()=>{const u=val(),d=m.querySelector('#gu_d').value||today();if(!ok(u))return toast('URL should look like https://script.google.com/macros/s/…/exec',4000);
